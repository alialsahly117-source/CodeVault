# Without this, a request to /api/* (e.g. if VITE_API_URL is ever unset,
# leaving the app to call a relative "/api" instead of the real
# api.codevault.vip origin) silently falls through to the catch-all below
# and gets served index.html with a 200 — the app then treats that HTML as
# a "successful" JSON response, which crashes React Query's own invariant
# check ("data is undefined") instead of failing as a clean, recognizable
# API error. This makes /api/* 404 loudly instead.
[[redirects]]
  from = "/api/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. The public site loads: its own bundle, Google Fonts,
# Monaco (lazily, from jsdelivr — @monaco-editor/react's default loader),
# user-supplied preview/avatar images over https, and the API on
# api.codevault.vip. Anything outside that list is blocked.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.codevault.vip https://cdn.jsdelivr.net; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
