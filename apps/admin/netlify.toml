# Without this, a request to /api/* (e.g. if VITE_API_URL is ever unset,
# leaving the app to call a relative "/api" instead of the real
# api.codevault.vip origin) silently falls through to the catch-all below
# and gets served index.html with a 200 — the app then treats that HTML as
# a "successful" JSON response, which crashes React Query's own invariant
# check ("data is undefined") instead of failing as a clean, recognizable
# API error. This makes /api/* 404 loudly instead.
[[redirects]]
  from = "/api/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The admin dashboard is stricter than the public site: no Monaco/CDN
# scripts here (it uses a plain textarea for code), so scripts are
# self-only. It must also never be indexed or framed.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://api.codevault.vip; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Robots-Tag = "noindex, nofollow"
