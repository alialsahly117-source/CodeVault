services:
  - type: web
    name: codevault-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codevault-db
          property: connectionString
      - key: PORT
        value: "4000"
      - key: WEB_URL
        value: https://codevault.vip
      - key: ADMIN_URL
        value: https://admin.codevault.vip
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: TWO_FACTOR_ENCRYPTION_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # web/admin/api now share codevault.vip as a real parent domain, so
      # with COOKIE_DOMAIN=".codevault.vip" below, requests between them are
      # same-site — SameSite=Lax works and is safer than None (extra CSRF
      # defense on top of the Origin check in app.ts). See lib/cookies.ts.
      - key: COOKIE_SAMESITE
        value: "lax"
      - key: COOKIE_DOMAIN
        value: ".codevault.vip"
      # Gmail SMTP never worked here — Render's containers time out on every
      # outbound SMTP connection (port 465/587), a common anti-spam
      # restriction on free/cheap hosting. Resend's API runs over HTTPS
      # (port 443), which isn't affected. See lib/email.ts.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: ""
      - key: SMTP_FROM_NAME
        value: "CodeVault"
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
      - key: GOOGLE_CALLBACK_URL
        value: https://api.codevault.vip/api/auth/google/callback

databases:
  - name: codevault-db
    plan: free
    databaseName: codevault
    user: codevault
