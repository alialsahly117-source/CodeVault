services:
  - type: web
    name: codevault-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codevault-db
          property: connectionString
      - key: PORT
        value: "4000"
      - key: WEB_URL
        value: https://codevault-web.netlify.app
      - key: ADMIN_URL
        value: https://codevault-admin.netlify.app
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: COOKIE_SECURE
        value: "true"
      # web/admin (*.netlify.app) and this API (*.onrender.com) are unrelated
      # domains, so the auth cookie needs SameSite=None to survive the
      # cross-site fetch — see apps/api/src/lib/cookies.ts.
      - key: COOKIE_SAMESITE
        value: "none"
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
      # Update this if the service's onrender.com hostname ever changes.
      - key: GOOGLE_CALLBACK_URL
        value: https://codevault-api-9mo5.onrender.com/api/auth/google/callback

databases:
  - name: codevault-db
    plan: free
    databaseName: codevault
    user: codevault
